[theme]
# Black background, white text, forest-green accent (#40916C — bright
# enough to read against pure black for buttons / links / active-tab
# underline). Severity badges keep their semantic colors since they
# convey meaning, not style.
base = "dark"
primaryColor = "#40916C"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141414"
textColor = "#FFFFFF"
font = "serif"
